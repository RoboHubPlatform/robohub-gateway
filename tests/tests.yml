# The gateway's own smoke test, driven through the host's Python once the Go
# server is built. It drives a telemetry frame through a pty and checks the API,
# the root page, the streamed datagrams and the uplink.
name: gateway
suites:
  - name: gateway-smoke
    kind: command
    tags: [smoke]
    command: [python3, tools/smoke.py]
  # The trust rules: the node manifest, announces, sessions bound to their link,
  # replayed hellos, and counters across a restart.
  - name: gateway-security
    kind: command
    tags: [smoke, security]
    command: [python3, tools/security-smoke.py]
  # Key epochs and their rotation: the grace epoch, REKEY and its proof, the old
  # key refused once the new one is confirmed, a board that cannot rotate, and
  # the C host node rewriting its key file (skipped when that node is not built).
  - name: gateway-rekey
    kind: command
    tags: [smoke, security, rekey]
    command: [python3, tools/rekey-smoke.py]
  # The C relay end to end: boards sealed behind it, their frames carried whole
  # in RELAYED and opened with their own keys; the downlink through it; a relay
  # that forges; the USB port; a gateway in relay mode; the master restarting.
  # It builds robohub-drivers' relay-host natively, and says SKIP (and passes)
  # where that checkout or a C toolchain is missing.
  - name: gateway-relay
    kind: command
    tags: [smoke, security, relay]
    command: [python3, tools/relay-smoke.py]
  # A gateway restart, as the boards holding a session see it: the restored
  # session's counter mark, SESSION_RESET down the serial link at open, through
  # a relay inside RELAYED and on a new uplink connection, the board's new
  # session heard at once, and a frame recorded before the restart still
  # refused. The C host node on the serial link is heard again within seconds
  # (skipped when robohub-devices' gateway_node is not built).
  - name: gateway-restart
    kind: command
    tags: [smoke, security, restart]
    command: [python3, tools/restart-smoke.py]
