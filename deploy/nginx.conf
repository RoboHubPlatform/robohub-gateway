# nginx in front of the RoboHub gateway.
#
# Two things are in front: the HTTP API over TLS, and — if you choose to — the
# uplink, which is a raw TCP stream rather than HTTP and needs the `stream`
# module rather than `http`.
#
# In the ISPConfig walkthrough this file is not used directly: ISPConfig owns the
# vhost. This is the plain-nginx equivalent, and the registry's deployment notes
# apply to the API half.

# The HTTP API.
server {
    listen 443 ssl http2;
    server_name gw.example.com;

    ssl_certificate     /etc/letsencrypt/live/gw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gw.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The uplink, if you front it with nginx instead of publishing the port.
#
# It belongs at the top level of nginx.conf, not inside `http`: the `stream`
# module is its own context. A relay dials the gateway; nginx passes the bytes to
# the container and does not read them, because the frames are the gateway's.
#
#   stream {
#       server {
#           listen 5001;
#           proxy_pass 127.0.0.1:5001;
#           proxy_timeout 1h;
#       }
#   }
